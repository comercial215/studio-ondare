name: Backup semanal do banco

on:
  schedule:
    - cron: "0 6 * * 0" # todo domingo, 06:00 UTC (03:00 no horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions do GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Gerar backup do banco
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > backup.sql.gz

      - name: Publicar backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-studio-ondare-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 90
